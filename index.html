<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        -webkit-text-size-adjust: 100%;
      }

      .control-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.9);
        padding: 20px;
        border-radius: 12px;
        color: white;
        font-family: Arial, sans-serif;
        width: 400px;
        max-width: calc(100vw - 40px);
      }

      .control-panel h3 {
        margin: 0 0 15px 0;
        color: white;
        font-size: 18px;
      }

      .control-panel .form-group {
        margin-bottom: 15px;
      }

      .control-panel label {
        display: block;
        margin-bottom: 5px;
        color: white;
      }

      .control-panel select,
      .control-panel input {
        width: 100%;
        padding: 10px 8px;
        border-radius: 4px;
        border: none;
        margin-bottom: 5px;
        font-size: 16px;
      }

      .control-panel button {
        background: #4caf50;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        min-height: 44px;
      }

      @media (max-width: 600px) {
        .control-panel {
          top: max(12px, env(safe-area-inset-top));
          left: max(12px, env(safe-area-inset-left));
          right: max(12px, env(safe-area-inset-right));
          width: auto;
          max-width: none;
          padding: 16px;
        }
      }
    </style>
    <script>
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      function getApParam() {
        return getQueryParam("ap") || getQueryParam("id");
      }

      function validateEnvironment() {
        const env = getQueryParam("env");
        const ap = getApParam();
        const allowedEnvs = ["dev", "staging", "prod"];

        let hasErrors = false;
        const errorMessages = [];

        if (!env || !allowedEnvs.includes(env)) {
          hasErrors = true;
          errorMessages.push({
            title: "Environment Required",
            message:
              "Please add an environment query parameter: ?env=dev, ?env=staging, or ?env=prod",
            background: "#ff6b6b",
          });
        }

        if (!ap) {
          hasErrors = true;
          errorMessages.push({
            title: "AP Parameter Required",
            message: "Please add an 'ap' query parameter to the URL",
            background: "#ff9500",
          });
        }

        // Always show the form for parameter management
        const container = document.createElement("div");
        container.className = "control-panel";

        const title = document.createElement("h3");
        title.textContent =
          env && ap ? "Update Parameters" : "Missing Required Parameters";
        container.appendChild(title);

        // Environment input - always show
        const envGroup = document.createElement("div");
        envGroup.className = "form-group";

        const envLabel = document.createElement("label");
        envLabel.textContent = "Environment:";
        envGroup.appendChild(envLabel);

        const envSelect = document.createElement("select");
        envSelect.innerHTML = `
          <option value="">Select environment...</option>
          <option value="dev" ${env === "dev" ? "selected" : ""}>dev</option>
          <option value="staging" ${
            env === "staging" ? "selected" : ""
          }>staging</option>
          <option value="prod" ${env === "prod" ? "selected" : ""}>prod</option>
        `;
        envGroup.appendChild(envSelect);

        container.appendChild(envGroup);

        // AP input - always show
        const apGroup = document.createElement("div");
        apGroup.className = "form-group";

        const apLabel = document.createElement("label");
        apLabel.textContent = "AP Parameter:";
        apGroup.appendChild(apLabel);

        const apInput = document.createElement("input");
        apInput.type = "text";
        apInput.placeholder = "Enter AP value...";
        apInput.value = ap || "";
        apGroup.appendChild(apInput);

        container.appendChild(apGroup);

        // Update button
        const updateBtn = document.createElement("button");
        updateBtn.textContent =
          env && ap ? "Update Parameters" : "Add Parameters";
        updateBtn.onclick = function () {
          const newEnv = container.querySelector("select")?.value || env;
          const newAp = container.querySelector("input")?.value || ap;

          if (newEnv && newAp) {
            const url = new URL(window.location);
            url.searchParams.set("env", newEnv);
            url.searchParams.set("ap", newAp);
            url.searchParams.set("id", newAp);
            window.location.href = url.toString();
          } else {
            alert("Please fill in all required fields");
          }
        };
        container.appendChild(updateBtn);

        document.body.appendChild(container);

        // Return validation result for script loading logic
        return hasErrors;
      }

      const apFromUrl = getApParam();

      if (apFromUrl) {
        window.YONDER__CLIENT_CODE = String(apFromUrl);
      }

      function loadWidgetScript() {
        const env = getQueryParam("env");
        let scriptUrl;

        switch (env) {
          case "dev":
            scriptUrl = "https://dev.widget.yonderhq.com/main.js";
            break;
          case "staging":
            scriptUrl = "https://staging.widget.yonderhq.com/main.js";
            break;
          case "prod":
            scriptUrl = "https://widget.yonderhq.com/main.js";
            break;
          default:
            scriptUrl = "https://staging.widget.yonderhq.com/main.js";
        }

        const script = document.createElement("script");
        script.src = scriptUrl;
        document.head.appendChild(script);
      }

      document.addEventListener("DOMContentLoaded", function () {
        // Always show the form for parameter management
        validateEnvironment();

        // Only load widget script if validation passes
        if (getQueryParam("env") && getApParam()) {
          loadWidgetScript();
        }
      });
    </script>
  </head>
  <body></body>
</html>
